name: Refresh NFL data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10,16,22 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download latest datasets
        run: python scripts/sync.py
      - name: Collect free publicly displayed odds (best effort)
        run: python scripts/free_odds.py || echo "Free odds unavailable; previous snapshot retained"
      - name: Save refreshed data
        run: |
          git config user.name 'fieldedge-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || (git commit -m 'Refresh NFL datasets' && git push)
